</head>
<body>
  <header class="navbar">
    <a href="/" class="logo">新移民防踩坑</a>
    <small class="subtitle">这里有最全的攻略帮你快速开局。只放干货，杜绝踩坑。</small>
    <button class="menu-toggle" aria-label="Toggle menu" id="menu-toggle">
      ☰
    </button>
    <nav class="nav-links" id="nav-links">
      <a href="/work.html">找工</a>
      <a href="/workBlack.html">找工黑名单</a>
      <a href="/rent.html">租房</a>
      <a href="/rentBlack.html">租房黑名单</a>
      <a href="/tel.html">电话卡</a>
      <a href="/bank.html">银行卡</a>
      <a href="/drive.html">驾照</a>
      <a href="/id.html">身份</a>

      <span id="auth-links">

      </span>
    </nav>
  </header>
  <main class="container">
    <h2 id="result-title"></h2>
    <div id="result-content"></div>
    <br><br><br>
    <p><a href="/workBlack.html" class="btn btn-secondary">返回，重新搜索</a></p>
  </main>
  <footer class="site-footer">
    Copyright ©2025 新移民第一站 All Rights Reserved
  </footer>
  <script src="/static/updateAuthLinks.js"></script>
  <script src="/static/mobile-nav.js"></script>
  <script>
    // 强制更新认证链接
    console.log('workResult.html 页面加载完成，强制更新认证链接');
    if(typeof updateAuthLinks === 'function') {
      updateAuthLinks();
    } else {
      console.error('updateAuthLinks 函数未找到');
    }
  </script>
  <script>
    // 假设API返回格式: { names: ["公司A", "公司B"], name: "xxx" }
    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }
    async function fetchResult() {
      const name = getQueryParam('name');
      document.getElementById('result-title').textContent = `公司名字包含"${name}"的黑名单：`;
      const res = await fetch(`https://api.newimmi.vip/api/work?name=${encodeURIComponent(name)}`);
      const response = await res.json();
      const container = document.getElementById('result-content');
      if (response.success && response.data && response.data.length > 0) {
        const names = response.data.map(item => item.name).filter(name => name);
        if (names.length > 0) {
        const ol = document.createElement('ol');
        ol.className = 'result-list';
                  names.forEach(n => {
          const li = document.createElement('li');
          li.innerHTML = `${n} <a href="/workDetail.html?name=${encodeURIComponent(n)}">点击查看详情</a>`;
          ol.appendChild(li);
        });
        container.appendChild(ol);
      } else {
        container.innerHTML = `<div class="no-results">
          <h3>🎉 好消息！</h3>
          <p>没有找到包含 "<strong>${name}</strong>" 的黑名单公司。</p>
          <p>这意味着该公司目前没有在我们的黑名单中，但仍建议您：</p>
          <ul>
            <li>仔细了解公司背景和经营状况</li>
            <li>查看公司评价和员工反馈</li>
            <li>注意合同条款和薪资待遇</li>
            <li>保留所有沟通和合同文件</li>
          </ul>
        </div>`;
      }
    }
    fetchResult();
  </script>
</body>
</html>
