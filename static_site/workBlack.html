<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找工黑名单查询</title>
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <a href="/" class="logo">新移民防踩坑</a>
    <small class="subtitle">这里有最全的攻略帮你快速开局。只放干货，杜绝踩坑。</small>
    <button class="menu-toggle" aria-label="Toggle menu" id="menu-toggle">
      ☰
    </button>
    <nav class="nav-links" id="nav-links">
      <a href="/work.html">找工</a>
      <a href="/workBlack.html">找工黑名单</a>
      <a href="/rent.html">租房</a>
      <a href="/rentBlack.html">租房黑名单</a>
      <a href="/tel.html">电话卡</a>
      <a href="/bank.html">银行卡</a>
      <a href="/drive.html">驾照</a>
      <a href="/id.html">身份</a>
      <a href="/contact.html">联系我们</a>
      <a href="/res.html">免责与隐私</a>
      <span id="auth-links">
        <a href="/login.html" id="login-link">登录</a>
        <a href="/register.html" id="register-link">注册</a>
      </span>
    </nav>
  </header>
  <main class="container">
    <div class="article-content">
      <h2 class="article-title">找工黑名单查询</h2>
      <div id="auth-check" style="display:none;">
        <div class="auth-message">
          <h3>需要登录</h3>
          <p>此功能需要登录后才能使用。</p>
          <a href="/login.html" class="btn btn-primary">立即登录</a>
        </div>
      </div>
      <div id="membership-check" style="display:none;">
        <div class="auth-message">
          <h3>需要会员权限</h3>
          <p>此功能需要会员权限才能使用。购买会员后可以访问所有黑名单功能。</p>
          <a href="/membership.html" class="btn btn-primary">购买会员</a>
        </div>
      </div>
      <div id="search-form" style="display:none;">
        <form id="nameForm" class="auth-form">
          <label for="name">请在下面的框中输入想要查询的公司名称，看看这家公司是否已经有人踩坑。只能输入中英文，不允许其它任何字符和空格。</label>
          <input type="text" id="name" name="name" class="form-control" required pattern="^[\u4e00-\u9fa5a-zA-Z]+$" title="请输入要查询的公司名称">
          <button type="submit" class="btn btn-primary">查询</button>
        </form>
        <div id="result" style="margin-top:20px;"></div>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    Copyright ©2025 新移民第一站 All Rights Reserved
  </footer>
  <script src="/static/updateAuthLinks.js"></script>
  <script src="/static/mobile-nav.js"></script>
  <script>
    // 检查用户权限
    async function checkAuth() {
      try {
        const resp = await fetch('http://localhost:5002/api/check-auth', {credentials: 'include'});
        const data = await resp.json();
        
        if (!data.authenticated) {
          document.getElementById('auth-check').style.display = 'block';
          return;
        }
        
        if (!data.membership_active) {
          document.getElementById('membership-check').style.display = 'block';
          return;
        }
        
        // 用户已登录且有会员权限，显示搜索表单
        document.getElementById('search-form').style.display = 'block';
      } catch (err) {
        console.error('权限检查失败:', err);
        document.getElementById('auth-check').style.display = 'block';
      }
    }

    // 页面加载时检查权限
    checkAuth();

    document.getElementById('nameForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '';
      if (!/^[\u4e00-\u9fa5a-zA-Z]+$/.test(name)) {
        alert('请输入公司名称，中文或者英语字母');
        return;
      }
      resultDiv.textContent = '查询中...';
      try {
        const resp = await fetch(`http://localhost:5002/api/workDetail/${encodeURIComponent(name)}`, {credentials: 'include'});
        const data = await resp.json();
        if (data.success) {
          resultDiv.innerHTML = `<b>公司名称：</b>${data.data.name}<br><b>地址：</b>${data.data.address}<br><b>详情：</b>${data.data.content}`;
        } else {
          resultDiv.innerHTML = '<span style="color:green;">该公司暂无黑名单记录！</span>';
        }
      } catch (err) {
        resultDiv.innerHTML = '<span style="color:red;">查询失败，请稍后重试。</span>';
      }
    });
  </script>
</body>
</html>
