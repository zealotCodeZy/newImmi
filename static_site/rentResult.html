  <script src="/static/updateAuthLinks.js"></script>
  <script>
    // 强制更新认证链接
    console.log('rentResult.html 页面加载完成，强制更新认证链接');
    if(typeof updateAuthLinks === 'function') {

      console.error('updateAuthLinks 函数未找到');
    }
  </script>
  <script>
    // 假设API返回格式: { addresses: ["地址A", "地址B"], zipcode: "xxxxx" }
    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }
    async function fetchResult() {
      const zipcode = getQueryParam('zipcode');
      document.getElementById('result-title').textContent = `在${zipcode}地址范围，黑名单房源如下：`;
      const res = await fetch(`/api/rent-blacklist?zipcode=${encodeURIComponent(zipcode)}`);
      const data = await res.json();
      const container = document.getElementById('result-content');
      if (data.addresses && data.addresses.length > 0) {
        const ol = document.createElement('ol');
        ol.className = 'result-list';
        data.addresses.forEach(addr => {
          const li = document.createElement('li');
          li.innerHTML = `${addr} <a href="/rentDetail.html?address=${encodeURIComponent(addr)}">点击查看详情</a>`;
          ol.appendChild(li);
        });
        container.appendChild(ol);
      } else {
        container.innerHTML = `<div class="no-results">
          <h3>🎉 好消息！</h3>
          <p>在邮编 <strong>${zipcode}</strong> 范围内，目前没有发现黑名单房源。</p>
          <p>这意味着该地区的房源相对安全，但仍建议您：</p>
          <ul>
            <li>仔细查看租房合同条款</li>
            <li>实地考察房屋状况</li>
            <li>了解房东背景信息</li>
            <li>保留所有沟通记录</li>
          </ul>
        </div>`;
      }
    }
    fetchResult();
  </script>
</body>
</html>
