<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>调试页面</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .debug-info { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
    button { padding: 10px 20px; margin: 5px; }
  </style>
</head>
<body>
  <h1>登录状态调试</h1>
  
  <div class="debug-info">
    <h3>localStorage中的token:</h3>
    <div id="token-info"></div>
  </div>
  
  <div class="debug-info">
    <h3>API响应:</h3>
    <div id="api-response"></div>
  </div>
  
  <div class="debug-info">
    <h3>控制台日志:</h3>
    <div id="console-log"></div>
  </div>
  
  <button onclick="checkAuth()">检查认证状态</button>
  <button onclick="clearToken()">清除Token</button>
  <button onclick="goToLogin()">去登录页面</button>
  
  <script>
    // 重写console.log来捕获日志
    const originalLog = console.log;
    const originalError = console.error;
    const logContainer = document.getElementById('console-log');
    
    console.log = function(...args) {
      originalLog.apply(console, args);
      logContainer.innerHTML += '<div style="color: green;">' + args.join(' ') + '</div>';
    };
    
    console.error = function(...args) {
      originalError.apply(console, args);
      logContainer.innerHTML += '<div style="color: red;">' + args.join(' ') + '</div>';
    };
    
    function updateTokenInfo() {
      const token = localStorage.getItem('authToken');
      document.getElementById('token-info').innerHTML = token ? 
        '<span style="color: green;">Token存在: ' + token.substring(0, 20) + '...</span>' : 
        '<span style="color: red;">Token不存在</span>';
    }
    
    async function checkAuth() {
      console.log('开始检查认证状态...');
      updateTokenInfo();
      
      const token = localStorage.getItem('authToken');
      const headers = {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      };
      
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
        console.log('添加Authorization头:', `Bearer ${token.substring(0, 20)}...`);
      }
      
      try {
        const resp = await fetch('https://api.newimmi.vip/api/auth/check-auth', {
          method: 'GET',
          credentials: 'include',
          headers: headers
        });
        
        console.log('API响应状态:', resp.status);
        console.log('API响应头:', Object.fromEntries(resp.headers.entries()));
        
        const data = await resp.json();
        console.log('API响应数据:', data);
        
        document.getElementById('api-response').innerHTML = 
          '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        
      } catch (error) {
        console.error('检查认证状态失败:', error);
        document.getElementById('api-response').innerHTML = 
          '<div style="color: red;">错误: ' + error.message + '</div>';
      }
    }
    
    function clearToken() {
      localStorage.removeItem('authToken');
      console.log('Token已清除');
      updateTokenInfo();
    }
    
    function goToLogin() {
      window.location.href = '/login.html';
    }
    
    // 页面加载时更新token信息
    updateTokenInfo();
  </script>
</body>
</html>
