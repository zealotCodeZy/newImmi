<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>租房黑名单查询</title>
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <a href="/" class="logo">新移民防踩坑</a>
    <small class="subtitle">这里有最全的攻略帮你快速开局。只放干货，杜绝踩坑。</small>
    <button class="menu-toggle" aria-label="Toggle menu" id="menu-toggle">
      ☰
    </button>
    <nav class="nav-links" id="nav-links">
      <a href="/work.html">找工</a>
      <a href="/workBlack.html">找工黑名单</a>
      <a href="/rent.html">租房</a>
      <a href="/rentBlack.html">租房黑名单</a>
      <a href="/tel.html">电话卡</a>
      <a href="/bank.html">银行卡</a>
      <a href="/drive.html">驾照</a>
      <a href="/id.html">身份</a>
      <a href="/contact.html">联系我们</a>
      <a href="/res.html">免责与隐私</a>
      <span id="auth-links">
        <a href="/login.html" id="login-link">登录</a>
        <a href="/register.html" id="register-link">注册</a>
      </span>
    </nav>
  </header>
  <main class="container">
    <div class="article-content">
      <h2 class="article-title">租房黑名单查询</h2>
      <div id="auth-check" style="display:none;">
        <div class="auth-message">
          <h3>需要登录</h3>
          <p>此功能需要登录后才能使用。</p>
          <a href="/login.html" class="btn btn-primary">立即登录</a>
        </div>
      </div>
      <div id="membership-check" style="display:none;">
        <div class="auth-message">
          <h3>需要会员权限</h3>
          <p>此功能需要会员权限才能使用。购买会员后可以访问所有黑名单功能。</p>
          <a href="/membership.html" class="btn btn-primary">购买会员</a>
        </div>
      </div>
      <div id="search-form" style="display:none;">
        <form id="zipcodeForm" class="auth-form">
          <p><label for="zipcode">请在下面的框中输入目标房子所在地的邮编(zip code，5位数数字)，看看在这个地区的黑名单中有没有这套房。</label></p>
          <p class="center-block no-indent"><input type="text" id="zipcode" name="zipcode" class="form-control" required pattern="^\d{5}$" title="请输入5位数字的美国邮编(zip code)"></p>
          <br>
          <p class="center-block no-indent"><button type="submit" class="btn btn-primary">查询</button></p>
        </form>
        <div id="result" style="margin-top:20px;"></div>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    Copyright ©2025 新移民第一站 All Rights Reserved<br>Built & Designed by Albert Zhu - Available for Hire/Tutoring in LA.
  </footer>
  <script src="/static/updateAuthLinks.js"></script>
  <script src="/static/mobile-nav.js"></script>
  <script>
    // 检查用户权限
    async function checkAuth() {
      try {
        const token = localStorage.getItem('authToken');
        const headers = { 'Content-Type': 'application/json' };
        if (token) {
          headers['Authorization'] = `Bearer ${token}`;
        }
        const resp = await fetch('https://api.newimmi.vip/api/auth/check-auth', {
          credentials: 'include',
          headers: headers
        });
        const data = await resp.json();
        
        if (!data.data || !data.data.authenticated) {
          document.getElementById('auth-check').style.display = 'block';
          return;
        }
        
        if (!data.data.user || !data.data.user.is_member) {
          document.getElementById('membership-check').style.display = 'block';
          return;
        }
        
        // 用户已登录且有会员权限，显示搜索表单
        document.getElementById('search-form').style.display = 'block';
      } catch (err) {
        console.error('权限检查失败:', err);
        document.getElementById('auth-check').style.display = 'block';
      }
    }

    // 页面加载时检查权限
    checkAuth();

    document.getElementById('zipcodeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const zipcode = document.getElementById('zipcode').value.trim();
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '';
      if (!/^\d{5}$/.test(zipcode)) {
        alert('请输入5位数字的美国邮编(zip code)');
        return;
      }
      resultDiv.textContent = '查询中...';
      try {
        const resp = await fetch(`https://api.newimmi.vip/api/rent?zipcode=${zipcode}`, {credentials: 'include'});
        const data = await resp.json();
        if (data.success && data.data && data.data.length > 0) {
          let resultHtml = '<b>黑名单房源信息：</b><ul>';
          data.data.forEach(rent => {
            resultHtml += `<li>
              <div style="margin-bottom: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                <b>地址：</b>${rent.address || '未提供'}<br>
                <b>邮编：</b>${rent.zipcode || '未提供'}<br>
                <b>详情：</b>${rent.content || '无详细信息'}
              </div>
            </li>`;
          });
          resultHtml += '</ul>';
          resultDiv.innerHTML = resultHtml;
        } else {
          resultDiv.innerHTML = '<span style="color:green;">该地区暂无黑名单房源！</span>';
        }
      } catch (err) {
        resultDiv.innerHTML = '<span style="color:red;">查询失败，请稍后重试。</span>';
      }
    });
  </script>
</body>
</html>
