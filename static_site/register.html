<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>用户注册</title>
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <a href="/" class="logo">新移民防踩坑</a>
    <small class="subtitle">这里有最全的攻略帮你快速开局。只放干货，杜绝踩坑。</small>
    <button class="menu-toggle" aria-label="Toggle menu" id="menu-toggle">
      ☰
    </button>
    <nav class="nav-links" id="nav-links">
      <a href="/work.html">找工</a>
      <a href="/workBlack.html">找工黑名单</a>
      <a href="/rent.html">租房</a>
      <a href="/rentBlack.html">租房黑名单</a>
      <a href="/tel.html">电话卡</a>
      <a href="/bank.html">银行卡</a>
      <a href="/drive.html">驾照</a>
      <a href="/id.html">身份</a>
      <a href="/contact.html">联系我们</a>
      <a href="/res.html">免责与隐私</a>
      <span id="auth-links">
        <a href="/login.html" id="login-link">登录</a>
        <a href="/register.html" id="register-link">注册</a>
      </span>
    </nav>
  </header>
  <main class="container">
    <div class="auth-container">
      <h2>用户注册</h2>
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="username">用户名:</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
          <label for="email">邮箱:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">密码:</label>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
          <label for="confirm-password">确认密码:</label>
          <input type="password" id="confirm-password" name="confirm-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-large">注册</button>
        <div id="register-message" style="color:red;margin-top:10px;"></div>
      </form>
      <div class="auth-links">
        <p>已有账号？<a href="/login.html">立即登录</a></p>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    Copyright ©2025 新移民第一站 All Rights Reserved<br>Built & Designed by Albert Zhu - Available for Hire/Tutoring in LA.
  </footer>
  <script src="/static/updateAuthLinks.js"></script>
  <script src="/static/mobile-nav.js"></script>
  <script>
    // 强制更新认证链接
    console.log('register.html 页面加载完成，强制更新认证链接');
    if(typeof updateAuthLinks === 'function') {
      updateAuthLinks();
    } else {
      console.error('updateAuthLinks 函数未找到');
    }
  </script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const msgDiv = document.getElementById('register-message');
      msgDiv.textContent = '';
      if (password !== confirmPassword) {
        msgDiv.textContent = '两次输入的密码不一致';
        return;
      }
      try {
        const resp = await fetch('https://api.newimmi.vip/api/auth/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, email, password})
        });
        const data = await resp.json();
        if (data.success) {
          alert('注册成功，请登录！');
          window.location.href = '/login.html';
        } else {
          msgDiv.textContent = data.message || '注册失败';
        }
      } catch (err) {
        msgDiv.textContent = '注册请求失败，请稍后重试。';
      }
    });
  </script>
</body>
</html>
