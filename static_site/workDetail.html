<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公司黑名单详情</title>
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <a href="/" class="logo">新移民防踩坑</a>
    <small class="subtitle">这里有最全的攻略帮你快速开局。只放干货，杜绝踩坑。</small>
    <nav class="nav-links" id="nav-links">
      <a href="/work.html">找工</a>
      <a href="/workBlack.html">找工黑名单</a>
      <a href="/rent.html">租房</a>
      <a href="/rentBlack.html">租房黑名单</a>
      <a href="/tel.html">电话卡</a>
      <a href="/bank.html">银行卡</a>
      <a href="/drive.html">驾照</a>
      <a href="/id.html">身份</a>
      <a href="/contact.html">联系我们</a>
      <a href="/res.html">免责与隐私</a>
      <span id="auth-links">
        <a href="/login.html" id="login-link">登录</a>
        <a href="/register.html" id="register-link">注册</a>
      </span>
    </nav>
  </header>
  <main class="container">
    <div class="article-content" id="detail-content">
      <h2>该公司上黑名单详情</h2>
      <div id="auth-check" style="display:none;">
        <div class="auth-message">
          <h3>需要登录</h3>
          <p>此功能需要登录后才能使用。</p>
          <a href="/login.html" class="btn btn-primary">立即登录</a>
        </div>
      </div>
      <div id="membership-check" style="display:none;">
        <div class="auth-message">
          <h3>需要会员权限</h3>
          <p>此功能需要会员权限才能使用。购买会员后可以访问所有黑名单功能。</p>
          <a href="/membership.html" class="btn btn-primary">购买会员</a>
        </div>
      </div>
      <div id="detail-content-area" style="display:none;">
        <div id="detail-loading">加载中...</div>
        <div id="detail-data" style="display:none;"></div>
        <div id="detail-error" style="color:red;display:none;"></div>
        <br><br><br>
        <p><a href="/workBlack.html" class="btn btn-secondary">返回，重新搜索</a></p>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    Copyright ©2025 新移民第一站 All Rights Reserved
  </footer>
  <script src="/static/updateAuthLinks.js"></script>
  <script>
    // 强制更新认证链接
    console.log('workDetail.html 页面加载完成，强制更新认证链接');
    if(typeof updateAuthLinks === 'function') {
      updateAuthLinks();
    } else {
      console.error('updateAuthLinks 函数未找到');
    }
  </script>
  <script>
    // 检查用户权限
    async function checkAuth() {
      try {
        const resp = await fetch('http://localhost:5002/api/check-auth');
        const data = await resp.json();
        
        if (!data.authenticated) {
          document.getElementById('auth-check').style.display = 'block';
          return;
        }
        
        if (!data.membership_active) {
          document.getElementById('membership-check').style.display = 'block';
          return;
        }
        
        // 用户已登录且有会员权限，显示详情内容
        document.getElementById('detail-content-area').style.display = 'block';
        loadDetail();
      } catch (err) {
        console.error('权限检查失败:', err);
        document.getElementById('auth-check').style.display = 'block';
      }
    }

    // 页面加载时检查权限
    checkAuth();

    // 获取URL参数name
    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }
    async function loadDetail() {
      const companyName = getQueryParam('name');
      const loading = document.getElementById('detail-loading');
      const dataDiv = document.getElementById('detail-data');
      const errorDiv = document.getElementById('detail-error');
      if (!companyName) {
        loading.style.display = 'none';
        errorDiv.textContent = '未指定公司名称参数';
        errorDiv.style.display = 'block';
        return;
      }
      try {
        const resp = await fetch(`http://localhost:5002/api/workDetail/${encodeURIComponent(companyName)}`);
        const data = await resp.json();
        loading.style.display = 'none';
        if (data.success) {
          dataDiv.innerHTML = `<p><strong>公司名称:</strong> ${data.data.name}</p><p><strong>地址:</strong> ${data.data.address}</p><p><strong>上黑名单原因:</strong> ${data.data.content}</p>`;
          dataDiv.style.display = 'block';
        } else {
          errorDiv.textContent = '未找到该公司的黑名单详情';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        loading.style.display = 'none';
        errorDiv.textContent = '加载失败，请稍后重试。';
        errorDiv.style.display = 'block';
      }
    }
  </script>
</body>
</html>
