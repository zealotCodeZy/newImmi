<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户登录</title>
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <a href="/" class="logo">新移民防踩坑</a>
    <small class="subtitle">这里有最全的攻略帮你快速开局。只放干货，杜绝踩坑。</small>
    <button class="menu-toggle" aria-label="Toggle menu" id="menu-toggle">
      ☰
    </button>
    <nav class="nav-links" id="nav-links">
      <a href="/work.html">找工</a>
      <a href="/workBlack.html">找工黑名单</a>
      <a href="/rent.html">租房</a>
      <a href="/rentBlack.html">租房黑名单</a>
      <a href="/tel.html">电话卡</a>
      <a href="/bank.html">银行卡</a>
      <a href="/drive.html">驾照</a>
      <a href="/id.html">身份</a>
      <a href="/contact.html">联系我们</a>
      <a href="/res.html">免责与隐私</a>
      <span id="auth-links">
        <a href="/login.html" id="login-link">登录</a>
        <a href="/register.html" id="register-link">注册</a>
      </span>
    </nav>
  </header>
  <main class="container">
    <div class="content">
      <div class="auth-container">
        <div id="alert-box" class="alert" style="display:none;"></div>
        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label for="username">用户名:</label>
            <input type="text" id="username" name="username" required class="form-control">
          </div>
          <div class="form-group">
            <label for="password">密码:</label>
            <input type="password" id="password" name="password" required class="form-control">
          </div>
          <button type="submit" class="btn btn-primary">登录</button>
        </form>
        <div class="auth-links">
          <p>还没有账号？ <a href="/register.html">立即注册</a></p>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    Copyright ©2025 新移民第一站 All Rights Reserved
  </footer>
  <script src="/static/updateAuthLinks.js"></script>
  <script src="/static/mobile-nav.js"></script>
  <script>
    // 强制更新认证链接
    console.log('login.html 页面加载完成，强制更新认证链接');
    if(typeof updateAuthLinks === 'function') {
      updateAuthLinks();
    } else {
      console.error('updateAuthLinks 函数未找到');
    }
  </script>
  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('alert-box');
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      alertBox.style.display = 'none';
      const data = {
        username: form.username.value.trim(),
        password: form.password.value
      };
      try {
        const resp = await fetch('https://api.newimmi.vip/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(data)
        });
        const result = await resp.json();
        alertBox.textContent = result.message;
        alertBox.className = 'alert ' + (result.success ? 'alert-success' : 'alert-danger');
        alertBox.style.display = 'block';
        if(result.success) {
          // 保存JWT token到localStorage
          if(result.data && result.data.token) {
            localStorage.setItem('authToken', result.data.token);
            console.log('JWT token已保存');
          }
          // 登录成功后立即更新当前页面的认证链接
          if(typeof updateAuthLinks === 'function') {
            await updateAuthLinks();
          }
          // 然后跳转到首页
          setTimeout(()=>{ window.location.href = '/index.html'; }, 1000);
        }
      } catch (err) {
        console.error('登录异常:', err);
        alertBox.textContent = '登录请求失败，请稍后重试。';
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
