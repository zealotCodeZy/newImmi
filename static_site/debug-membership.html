<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会员状态调试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { margin: 5px; padding: 10px 15px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>会员状态调试页面</h1>
    
    <div class="debug-section">
        <h3>当前 Token 信息</h3>
        <div id="token-info"></div>
        <button onclick="checkToken()">检查 Token</button>
        <button onclick="clearToken()">清除 Token</button>
    </div>
    
    <div class="debug-section">
        <h3>认证状态检查</h3>
        <div id="auth-status"></div>
        <button onclick="checkAuth()">检查认证状态</button>
    </div>
    
    <div class="debug-section">
        <h3>会员状态检查</h3>
        <div id="membership-status"></div>
        <button onclick="checkMembership()">检查会员状态</button>
    </div>
    
    <div class="debug-section">
        <h3>重新登录</h3>
        <input type="text" id="username" placeholder="用户名" value="testuser">
        <input type="password" id="password" placeholder="密码" value="testpass123">
        <button onclick="reLogin()">重新登录</button>
        <div id="login-result"></div>
    </div>
    
    <div class="debug-section">
        <h3>快速操作</h3>
        <button onclick="clearAllAndReload()">清除所有数据并刷新</button>
        <a href="/rentBlack.html" target="_blank">测试租房黑名单</a>
        <a href="/workBlack.html" target="_blank">测试找工黑名单</a>
    </div>

    <script>
        function checkToken() {
            const token = localStorage.getItem('authToken');
            const tokenInfo = document.getElementById('token-info');
            
            if (!token) {
                tokenInfo.innerHTML = '<p class="error">没有找到 Token</p>';
                return;
            }
            
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                const isExpired = new Date() > new Date(payload.exp * 1000);
                
                tokenInfo.innerHTML = `
                    <p class="info">Token 存在</p>
                    <p>用户ID: ${payload.id}</p>
                    <p>用户名: ${payload.username}</p>
                    <p>邮箱: ${payload.email}</p>
                    <p>签发时间: ${new Date(payload.iat * 1000).toLocaleString()}</p>
                    <p>过期时间: ${new Date(payload.exp * 1000).toLocaleString()}</p>
                    <p class="${isExpired ? 'error' : 'success'}">状态: ${isExpired ? '已过期' : '有效'}</p>
                `;
            } catch (e) {
                tokenInfo.innerHTML = '<p class="error">Token 格式错误</p>';
            }
        }
        
        function clearToken() {
            localStorage.removeItem('authToken');
            document.getElementById('token-info').innerHTML = '<p class="success">Token 已清除</p>';
        }
        
        async function checkAuth() {
            const statusDiv = document.getElementById('auth-status');
            const token = localStorage.getItem('authToken');
            
            if (!token) {
                statusDiv.innerHTML = '<p class="error">没有 Token</p>';
                return;
            }
            
            try {
                const response = await fetch('https://api.newimmi.vip/api/auth/check-auth', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                statusDiv.innerHTML = `
                    <p class="info">API 响应状态: ${response.status}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                statusDiv.innerHTML = `<p class="error">请求失败: ${error.message}</p>`;
            }
        }
        
        async function checkMembership() {
            const statusDiv = document.getElementById('membership-status');
            const token = localStorage.getItem('authToken');
            
            if (!token) {
                statusDiv.innerHTML = '<p class="error">没有 Token</p>';
                return;
            }
            
            try {
                const response = await fetch('https://api.newimmi.vip/api/membership?action=status', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                statusDiv.innerHTML = `
                    <p class="info">API 响应状态: ${response.status}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                statusDiv.innerHTML = `<p class="error">请求失败: ${error.message}</p>`;
            }
        }
        
        async function reLogin() {
            const resultDiv = document.getElementById('login-result');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('https://api.newimmi.vip/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success && data.data.token) {
                    localStorage.setItem('authToken', data.data.token);
                    resultDiv.innerHTML = `
                        <p class="success">登录成功！新 Token 已保存</p>
                        <p>会员状态: ${data.data.user.is_member ? '是会员' : '非会员'}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="error">登录失败: ${data.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">登录请求失败: ${error.message}</p>`;
            }
        }
        
        function clearAllAndReload() {
            localStorage.clear();
            sessionStorage.clear();
            location.reload();
        }
        
        // 页面加载时自动检查
        window.onload = function() {
            checkToken();
            checkAuth();
        };
    </script>
</body>
</html>
