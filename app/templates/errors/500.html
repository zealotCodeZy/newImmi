{% extends "base.html" %}

{% block title %}服务器错误 - 500{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <div class="error-icon">⚠️</div>
        <h1 class="error-title">500</h1>
        <h2 class="error-subtitle">服务器内部错误</h2>
        <p class="error-description">
            抱歉，服务器遇到了一个错误，无法完成您的请求。
        </p>
        <div class="error-actions">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary">返回首页</a>
            <a href="javascript:location.reload()" class="btn btn-secondary">重新加载</a>
        </div>
        <div class="error-help">
            <h3>您可以尝试：</h3>
            <ul>
                <li>刷新页面重试</li>
                <li>稍后再试</li>
                <li>返回首页浏览其他内容</li>
                <li>如果问题持续存在，请联系我们</li>
            </ul>
        </div>
    </div>
</div>
{% endblock %}
