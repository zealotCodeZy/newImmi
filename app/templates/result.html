
{% extends "base.html" %}

{% block title %}Result{% endblock %}

{% block content %}
    <h1>Results for {{ zipcode }}</h1>
    <ol>
    {% for address in addresses %}
        <li>
            {{ address }} 
            <a href="{{ url_for('main.detail', address=address) }}">详细</a>
        </li>
    {% endfor %}
    </ol>
    <p><a href="{{ url_for('main.index') }}">Back to Search</a></p>
{% endblock %}
