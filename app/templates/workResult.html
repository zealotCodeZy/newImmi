
{% extends "base.html" %}

{% block title %}搜索结果{% endblock %}

{% block content %}
    <h2>公司名字包含“{{ name }}”的黑名单：</h2>
    <ol class="result-list">
    {% for name in names %}
        <li>
            {{ name }} 
            <a href="{{ url_for('main.workDetail', name=name) }}">点击查看详情</a>
        </li>
    {% endfor %}
    </ol>
    <br>
    <br>
    <br>
    <p><a href="{{ url_for('main.workBlack') }}" class="btn btn-secondary">返回，重新搜索</a></p>
{% endblock %}
